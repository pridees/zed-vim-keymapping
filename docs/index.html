<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d0a"><meta name="description" content="A complete, searchable Zed Vim keymap. Custom leader keys, project tree, Git, agents and native Vim commands.">
<title>Zed / Vim — Keymap terminal</title>
<link rel="stylesheet" href="style.css?v=348bfbab0c3d"><script defer src="keymaps.js?v=2f0ccfa0122c"></script><script defer src="labels.js?v=9c95d003c9a9"></script><script defer src="app.js?v=ee51ae6f1428"></script>
</head>
<body>
<header><div class="brand"><span class="mark">[z_]</span><h1>ZED <span>/ VIM CHEATSHEET</span></h1></div><div class="status"><a href="https://github.com/pridees/zed-vim-keymapping" aria-label="View GitHub repository">GITHUB ↗</a></div></header>
<main>
<section class="command-bar" aria-label="Search and filters"><label class="search"><span aria-hidden="true">❯</span><input id="search" type="search" placeholder="Find a key or command…" autocomplete="off" aria-label="Search keys, actions and contexts"><kbd>/</kbd></label><button id="fullscreen" type="button">⛶ <span>FULLSCREEN</span></button></section>
<div class="toolbar"><nav id="sources" aria-label="Keymap layer"><button data-source="custom" aria-pressed="true">01 CUSTOM</button><button data-source="vim" aria-pressed="false">02 NATIVE VIM</button><button data-source="all" aria-pressed="false">03 ALL</button></nav><span id="count" role="status" aria-live="polite"></span></div>
<div class="filters"><label for="group">CONTEXT</label><select id="group"><option value="">All contexts</option></select><label class="toggle"><input id="disabled" type="checkbox"> Show disabled / prefixes</label></div>
<div class="legend"><span><kbd>Space</kbd> leader</span><span><kbd>G</kbd> = Shift + g</span><span><kbd>g</kbd> <kbd>l</kbd> = sequential</span><span class="hint">Select a row for exact context & parameters.</span></div>
<section id="cards" aria-label="Key bindings"></section><p id="empty" hidden>No matching bindings. Try another key or context.</p>
</main>
<footer><span>ZED 1.25.3 <span class="dim">// LINUX · VIM MODE</span></span><a href="https://zed.dev/docs/vim">VIM DOCS ↗</a><span class="dim">CUSTOM RULES TAKE PRIORITY IN MATCHING CONTEXTS</span></footer>
<noscript>This cheat sheet requires JavaScript. The complete keymap is available in the GitHub repository.</noscript>
</body></html>
